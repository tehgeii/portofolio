name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every 6 hours: rebuild so the GitHub stats and YouTube data stay fresh.
  schedule:
    - cron: "17 */6 * * *"

# Each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A newer push to the same pull request makes the older check pointless.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      - name: Refresh GitHub stats snapshot
        run: npm run stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # YouTube data is never committed: the last good copy lives in the Actions cache,
      # so an API hiccup keeps the previous videos instead of hiding the section.
      - name: Restore last YouTube data
        uses: actions/cache/restore@v6
        with:
          path: src/data/generated
          key: youtube-${{ github.run_id }}
          restore-keys: youtube-

      - name: Refresh YouTube data
        run: npm run youtube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Save YouTube data
        if: hashFiles('src/data/generated/youtube.json') != ''
        uses: actions/cache/save@v6
        with:
          path: src/data/generated
          key: youtube-${{ github.run_id }}

      - run: npm run build

      # Same site with the optional services switched on by dummy keys, only for tests.
      - run: npm run build:e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Never cancel a deployment halfway; a newer one simply waits its turn.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub pauses scheduled workflows after 60 days without commits. Re-enabling
  # the workflow on each scheduled run keeps the automatic refresh going.
  keepalive:
    name: Keep the schedule active
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
